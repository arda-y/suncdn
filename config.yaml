LOG_LEVEL: "info" # type: str

# Reverse proxied path to the API.
# Required for Swagger UI at /docs to work properly.
# Sync with: nginx reverse proxied path
ROOT_PATH: "/sun" # type: str

CDN_PATH: "/suncdn" # type: str

# The port to run the API server on.
# Sync with: docker-compose port argument, nginx reverse proxied port
PORT: 2003 # type: int

# Maximum size for a single file, in megabytes.
# Sync with: nginx client_max_body_size for the /sun/ location (arda0.net)
# and the /sun/uploadfile/ location (cdn.arda0.net)
MAX_FILE_SIZE: 1536 # type: int, 1.5GB

# The IP or domain to use when generating the download link.
# Has no effect on nginx or docker command, but is used in the API message returned.
# Passing environment variable from docker run command will override this.
IP_OR_DOMAIN: "https://cdn.arda0.net" # type: str

# Base URL (including the ROOT_PATH) for the delete links returned with each upload.
# cdn.arda0.net is DNS-only (no Cloudflare bot challenge), so scripts can call delete links.
DELETE_BASE_URL: "https://cdn.arda0.net/sun" # type: str

# Max file age in seconds.
# 3600 = 1 hour, 86400 = 1 day, 604800 = 1 week
MAX_FILE_AGE: 604800 # type: int

# Sets the allowed domains for CORS requests.
# If the request is not from one of these domains, it will be rejected.
# If you want to allow all domains, remove the already present domains and add "*".
ALLOWED_DOMAINS: # type: list[str]
#  - "*" # allows all domains, but is not recommended for production
  - "https://arda0.net"

# Trusted reverse proxy peers allowed to set X-Real-IP / X-Forwarded-For.
# Requests from any other peer have those headers ignored (anti-spoofing).
# Note: nginx runs on the host and reaches this container through Docker's
# published-port path, so the peer address seen here is the bridge network's
# gateway IP (docker inspect <container> -> NetworkSettings.Networks.*.Gateway),
# not 127.0.0.1. Keeping both covers direct (non-Docker) runs too.
TRUSTED_PROXIES: # type: list[str]
  - "127.0.0.1"
  - "172.21.0.1"

# Per-IP upload quotas, in megabytes.
HOURLY_UPLOAD_LIMIT_MB: 2048 # type: int, 2GB/hour
DAILY_UPLOAD_LIMIT_MB: 5120 # type: int, 5GB/day
WEEKLY_UPLOAD_LIMIT_MB: 10240 # type: int, 10GB/week
