<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="sun | FAQ">
    <meta property="og:description" content="upload limits, retention, and data policy for sun.">
    <meta property="og:site_name" content="sun">
    <meta property="og:image" content="https://arda0.net/assets/favicon">
    <meta property="og:url" content="https://arda0.net/sun/faq">
    <link rel="icon" href="/assets/favicon">

    <title>sun | FAQ</title>
    <script src="https://arda0.net/assets/tailwind.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* Slate 900 */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<header class="w-full max-w-2xl mx-auto px-4 py-8 flex justify-between items-end">
    <div class="flex flex-col gap-1">
        <a href="/sun/" target="_self"
            class="text-[10px] font-bold text-blue-400 hover:text-blue-300 transition-colors tracking-[0.2em] uppercase flex items-center gap-2">
            <span>←</span> back to sun
        </a>
        <h1 class="text-3xl font-black text-white tracking-tight">
            sun
        </h1>
    </div>
</header>

<div class="max-w-2xl mx-auto px-4 mb-8">
    <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-slate-800 to-transparent"></div>
</div>

<main class="p-4 flex justify-center">
    <div class="max-w-lg w-full space-y-4 pb-16">
        <header class="mb-4 text-center">
            <h1 class="text-2xl font-extrabold text-white tracking-tight mb-2">FAQ</h1>
            <div class="h-1 w-12 bg-blue-500 mx-auto rounded-full"></div>
        </header>

        <div id="faq-list" class="space-y-4"></div>
    </div>
</main>

<script>
    const faqs = [
        {
            q: 'How long does sun keep my file?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                sun keeps your file for 7 days. After 7 days, sun deletes the file. sun does not warn you before
                deletion. Save a copy if you need the file for longer.
            </p>`,
        },
        {
            q: 'What are the upload limits?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                A single file cannot be larger than 2GB. Per IP address, sun also applies three rolling limits:
            </p>
            <ul class="text-slate-300 text-sm leading-relaxed list-disc list-inside space-y-1 font-mono">
                <li>2GB per hour</li>
                <li>5GB per day</li>
                <li>10GB per week</li>
            </ul>
            <p class="text-slate-400 text-xs leading-relaxed pt-1">
                If you go over a limit, sun rejects the upload with an error. Wait for the limit to reset, then try
                again.
            </p>`,
        },
        {
            q: 'What data does sun collect?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                sun records your IP address for each upload. sun uses this to enforce the upload limits above.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                sun does not require an account. sun does not collect your name or email. sun does not link your IP
                address to a profile.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                sun does not keep your IP address forever. Once its cooldown passes, sun removes it. sun never
                links your IP address to the file you uploaded, so there is no way to tie an uploaded file back
                to the person who uploaded it.
            </p>`,
        },
        {
            q: 'How do I report abuse?',
            a: `<p class="text-slate-300 text-sm leading-relaxed">
                sun has no way of detecting abusive behavior automatically, because sun is fully anonymous.
            </p>
            <p class="text-slate-300 text-sm leading-relaxed">
                To report a file, contact
                <a href="mailto:me@arda0.net" class="text-blue-400 hover:text-blue-300 transition-colors">me@arda0.net</a>.
                We will do our best to comply manually.
            </p>`,
        },
    ];

    const faqList = document.getElementById('faq-list');

    // faqs is a fixed, hardcoded array above (not user input), so building the
    // answer body via innerHTML here is safe.
    faqs.forEach(f => {
        const card = document.createElement('div');
        card.className = 'glass-panel p-6 rounded-2xl shadow-2xl space-y-2';

        const h3 = document.createElement('h3');
        h3.className = 'text-[10px] font-bold text-blue-400 uppercase tracking-widest';
        h3.textContent = f.q;

        card.appendChild(h3);
        card.insertAdjacentHTML('beforeend', f.a);
        faqList.appendChild(card);
    });
</script>

</html>
